<svg xmlns="http://www.w3.org/2000/svg" width="280" height="80" viewBox="0 0 280 80" role="img">
  <title>Unified-EV</title>
  <desc>Unified-EV logo — charging connector icon with wordmark</desc>

  <!-- Icon mark background -->
  <rect x="0" y="0" width="80" height="80" rx="20" fill="#10b981"/>

  <!-- Charging plug body -->
  <rect x="32" y="12" width="16" height="32" rx="4" fill="white"/>
  <!-- Lightning bolt -->
  <polygon points="44,38 32,58 40,58 36,72 52,48 40,48 44,38" fill="white"/>
  <!-- Left prong -->
  <rect x="22" y="12" width="6" height="14" rx="2" fill="white" opacity="0.75"/>
  <!-- Right prong -->
  <rect x="52" y="12" width="6" height="14" rx="2" fill="white" opacity="0.75"/>

  <!-- Wordmark -->
  <text x="96" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#10b981" letter-spacing="-0.5">Unified</text>
  <text x="96" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="300" fill="#1f2937" letter-spacing="3">EV</text>
</svg>
